<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/database.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Document Management System" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Default title -->
    <title>Chargement...</title>

    <script>
      async function fetchSystemSettings(retryCount = 0) {
        const maxRetries = 3;
        const retryDelay = 1000; // 1 second
        
        // Try multiple API URLs since this runs before React proxy is active
        const apiUrls = [
          window.location.origin + '/api/settings',  // Proxy path
          window.location.protocol + '//' + window.location.hostname + ':5000/api/settings',  // Direct API
          '/api/settings'  // Relative path (might work with proxy)
        ];
        
        for (const apiUrl of apiUrls) {
          try {
            const response = await fetch(apiUrl, {
              method: 'GET',
              headers: {
                'Content-Type': 'application/json',
              },
              credentials: 'include'
            });
            
            if (!response.ok) {
              console.warn('Settings API returned status:', response.status, 'from', apiUrl);
              continue; // Try next URL
            }
            
            const data = await response.json();
            console.log('Settings API response from', apiUrl, ':', data);
            
            // The backend returns { systemName: "...", ... } directly
            const systemName = data.systemName;
            
            if (systemName && typeof systemName === 'string' && systemName.trim() !== '') {
              document.title = systemName.trim();
              console.log('Title successfully updated to:', systemName);
              return; // Success, exit function
            } else {
              console.warn('systemName is empty, null, or not a string:', systemName);
            }
          } catch (error) {
            console.warn('Failed to fetch from', apiUrl, ':', error.message);
            continue; // Try next URL
          }
        }
        
        // If all attempts failed and we haven't exceeded retries, try again after delay
        if (retryCount < maxRetries) {
          console.log('Retrying settings fetch in', retryDelay, 'ms (attempt', retryCount + 1, 'of', maxRetries + 1, ')');
          setTimeout(() => fetchSystemSettings(retryCount + 1), retryDelay);
        } else {
          // If all attempts failed, use default
          console.warn('All API attempts failed after', maxRetries + 1, 'tries, using default title');
          document.title = 'Filora';
        }
      }
    
      // Try to fetch settings immediately and also on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => fetchSystemSettings());
      } else {
        fetchSystemSettings();
      }
    </script>
    
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
